name: Original V45 - Build und Pruefung
on:
  push:
    branches:
      - test/original-v45-pruefung-20260911
permissions:
  contents: read
concurrency:
  group: original-v45-pruefung
  cancel-in-progress: true
jobs:
  original:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Originalstand dokumentieren
        run: |
          mkdir -p pruefberichte
          git rev-parse HEAD > pruefberichte/test-commit.txt
          git diff --name-status 6cb449ea8397ae3f14b96ab66f77213c8257a8e5 > pruefberichte/aenderungen.txt
          git archive --format=tar.gz --output=pruefberichte/original-quellcode.tar.gz 6cb449ea8397ae3f14b96ab66f77213c8257a8e5
          node --version > pruefberichte/umgebung.txt
          npm --version >> pruefberichte/umgebung.txt
      - name: Gesperrte Originalabhaengigkeiten installieren
        id: install
        run: |
          set -o pipefail
          timeout 420s npm ci --no-audit --no-fund 2>&1 | tee pruefberichte/installation.txt
      - name: Originalbuild und vorhandene Tests
        id: original_tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee pruefberichte/original-tests.txt
      - name: Lint pruefen
        if: always() && steps.install.outcome == 'success'
        run: |
          set -o pipefail
          npm run lint 2>&1 | tee pruefberichte/lint.txt
      - name: Separaten TypeScript-Status dokumentieren
        if: always() && steps.install.outcome == 'success'
        continue-on-error: true
        run: |
          set -o pipefail
          npx --no-install tsc --noEmit 2>&1 | tee pruefberichte/typescript.txt
      - name: Build intern zur weiteren Pruefung sichern
        if: always() && steps.original_tests.outcome == 'success'
        run: tar -czf pruefberichte/original-build.tar.gz dist
      - name: Pruefergebnisse sichern
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-v45-pruefung
          path: pruefberichte/
          retention-days: 7
          if-no-files-found: error
